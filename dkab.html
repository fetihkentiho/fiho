<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Bilgi Yarışması</title>
<style>
:root{--n:#1b3250;--t:#5bb8cf;--g:#16a34a;--r:#dc2626;--bg:#eef4f7}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:#1f2937}
header{background:var(--n);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px}
header h1{margin:0;font-size:20px}header small{opacity:.8;display:block}
.btn{border:0;border-radius:10px;padding:9px 14px;font-size:14px;cursor:pointer;background:var(--t);color:#fff;font-weight:600}
.btn.d{background:var(--n)}.btn.r{background:var(--r)}.btn.g{background:var(--g)}
#menuBtn{margin-left:auto}
main{max-width:820px;margin:18px auto;padding:0 12px}
.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 8px #0001;margin-bottom:14px}
.top{display:flex;justify-content:space-between;font-size:13px;color:#555;margin-bottom:8px}
.bar{height:8px;background:#dde;border-radius:6px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--t);transition:.3s}
.q{font-weight:600;white-space:pre-line;margin-bottom:12px;line-height:1.5}
.opt{display:block;width:100%;text-align:left;padding:11px 14px;margin:7px 0;border:2px solid #cfd8e0;border-radius:10px;background:#fff;font-size:15px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--t)}.opt.ok{background:#dcfce7;border-color:var(--g)}.opt.no{background:#fee2e2;border-color:var(--r)}
.nav{text-align:right;margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:12px 0}
.st{border-radius:12px;padding:12px;text-align:center;color:#fff;font-weight:700}.st b{display:block;font-size:26px}
.row{border-left:5px solid #ccc;padding:8px 10px;margin:6px 0;background:#f8fafc;border-radius:6px;font-size:14px}
.row.ok{border-color:var(--g)}.row.no{border-color:var(--r)}.row.bos{border-color:#f59e0b}
#modal{display:none;position:fixed;inset:0;background:#0007;z-index:9;overflow:auto;padding:14px}
#modal .box{background:#fff;max-width:720px;margin:0 auto;border-radius:14px;padding:18px}
.bt{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
input,select,textarea{width:100%;padding:8px;border:1px solid #bbc;border-radius:8px;font:inherit;margin:4px 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.li{display:flex;gap:6px;align-items:center;border-bottom:1px solid #eee;padding:5px 0;font-size:13px}.li span{flex:1}
#rapor{display:none}
/* Şablon düzeni */
.rh{background:var(--n);color:#fff;display:flex;align-items:center;gap:12px;padding:8px 14px;border-radius:8px}
.rh .no{background:var(--t);border-radius:50%;width:46px;height:46px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800}
.rh h2{flex:1;text-align:center;margin:0;font-size:22px;letter-spacing:1px}
.rk{background:#e3eef3;padding:5px 12px;margin:6px 0 12px;font-size:13px;font-weight:600;color:var(--n)}
.cols{column-count:2;column-gap:36px;column-rule:2px dotted #666}
.rq{break-inside:avoid;margin-bottom:16px;font-size:13px}.rq .q{font-size:13px;margin-bottom:5px}
.ro{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px}
.ak{margin-top:14px;font-size:12px;border-top:2px solid var(--n);padding-top:6px}
@media print{body[data-p]>*{display:none!important}body[data-p] #rapor{display:block!important}@page{size:A4;margin:10mm}body{background:#fff}}
@media(max-width:560px){.g2{grid-template-columns:1fr}}
</style></head><body>
<header><span style="font-size:30px">🎯</span><div><h1>Mini Bilgi Yarışması</h1><small>Öğrenciler için kısa tekrar soruları</small></div><button class="btn d" id="menuBtn" onclick="openM()">⚙️ Yarışma Menüsü</button></header>
<main id="app"></main>
<div id="modal"><div class="box">
<div style="display:flex;justify-content:space-between"><h3 style="margin:0">Yarışma Menüsü</h3><button class="btn r" onclick="closeM()">✕</button></div>
<div class="bt">
<button class="btn" onclick="yuk.click()">📤 Yükle</button><button class="btn" onclick="yeni()">🆕 Yeni</button>
<button class="btn" onclick="pr('test')">📄 PDF</button><button class="btn" onclick="word()">📝 Word</button>
<button class="btn r" onclick="tumSil()">🗑️ Sil</button><button class="btn g" onclick="yayimla()">🚀 Yayımla</button></div>
<input type="file" id="yuk" accept=".json,.pdf" hidden>
<label>PDF’den üretilecek soru sayısı <select id="ns"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></label>
<div class="g2"><input id="mb" placeholder="Başlık"><input id="mk" placeholder="Kazanım (örn. 7.1.1. ...)"><input id="ms" placeholder="Sınıf"><input id="mu" placeholder="Ünite"></div>
<hr><h4 id="ft" style="margin:6px 0">Soru ekle</h4>
<textarea id="qt" rows="3" placeholder="Soru"></textarea>
<div class="g2"><input id="oa" placeholder="A şıkkı"><input id="ob" placeholder="B şıkkı"><input id="oc" placeholder="C şıkkı"><input id="od" placeholder="D şıkkı"></div>
<label>Doğru cevap <select id="oz"><option>A</option><option>B</option><option>C</option><option>D</option></select></label>
<div class="bt"><button class="btn g" onclick="ekle()" id="eb">➕ Soruyu Ekle</button><button class="btn d" onclick="closeM();basla()">✔ Bitir</button></div>
<div id="list"></div></div></div>
<div id="rapor"></div>
<script>
const EMB=null;
const DEF={m:{b:"Melekleri Sınıflandırabilme",k:"7.1.1. Melekleri sınıflandırabilme",s:"7",u:"1"},qs:[
{q:"I. Nurdan yaratılmışlardır.\nII. Yeme, içme, evlenme ve cinsiyet gibi özellikleri yoktur.\nIII. Sürekli Allah'a ibadet ederler ve asla günah işlemezler.\nIV. İradeleri yoktur.\n\nÖzellikleri verilen varlık türü aşağıdakilerden hangisidir?",o:["İnsanlar","Melekler","Cinler","Bitkiler"],a:1},
{q:"Melekler Allah’ın emirlerini yerine getirmekle görevli olan nurdan yaratılmış varlıklardır. Her birinin farklı görevleri bulunmaktadır. Bu meleklerden bir tanesi de tabiat olaylarının ve canlıların rızkının temin edilmesinde görevlendirilmiştir. Yeryüzünde çıkan çeşit çeşit bitkiler, meyve ve sebzeler bu meleğin kontrolü altında gerçekleşmekte ve yeryüzünde yaratılmaktadır. İnsanların sağlıklı bir şekilde besin ihtiyacının karşılanmasında büyük bir etkiye sahip olmaktadır.\n\nMetindeki açıklamalar hangi melek hakkında yapılmıştır?",o:["Cebrail","Mikail","Azrail","İsrafil"],a:1},
{q:"İslam inancına göre varlıklar alemi sadece duyularımızla algıladığımız somut dünyadan ibaret değildir. Duyularımızla algılayamadığımız, ancak vahiy yoluyla bilgi sahibi olduğumuz bir de gayb alemi vardır.\n\nBuna göre aşağıdakilerden hangisi gayb alemine ait varlıklardan biri değildir?",o:["Melekler","Cinler","Gezegenler","Cennet ve Cehennem"],a:2},
{q:"I. Ateşten yaratılmıştır.\nII. İradeleri vardır.\nIII. Sürekli ibadetle meşgullerdir.\n\nNumaralanmış özelliklerden hangileri cinlerin özelliklerine örnek gösterilebilir?",o:["Yalnız I","I ve II","II ve III","I, II ve III"],a:1},
{q:"\"Surlara üflendiği gün, Allah'ın diledikleri müstesna olmak üzere göklerde ve yerde ne varsa hepsi dehşete kapılır...\" (Neml Suresi, 87. Ayet)\n\nAyet-i kerimede bahsedilen \"Sura üflemekle\" görevli melek aşağıdakilerden hangisidir?",o:["Mikail","İsrafil","Cebrail","Azrail"],a:1},
{q:"Mikroskop icat edilmeden önce insanlar gözle göremedikleri bakteri ve virüslerin varlığından habersizdi. Ancak bu mikroorganizmaların göremememiz nedeniyle \"yok\" olduklarını iddia etmek bilimsel açıdan büyük bir hata olurdu. Aynı şekilde, insan kulağı belirli frekans aralığındaki sesleri duyabilirken ultrasonik ses dalgalarını duyamaz.\n\nBu durum, insan algısının sınırlarını ortaya koymaktadır. Bu metinden hareketle aşağıdakilerden hangisine ulaşılabilir?",o:["Duyu organlarımızla algılayamadığımız varlıkların var olmadığını iddia edemeyiz.","Akıl ve bilim, gayb alemindeki varlıkların mahiyetini tam olarak açıklayabilir.","İnsanın duyu organları geliştikçe melek ve cinleri de görmesi mümkün olacaktır.","Teknoloji ilerledikçe görünmeyen varlıklara olan inanç tamamen ortadan kalkar."],a:0},
{q:"I. İnsanlara kabirde soru soracağı rivayet edilen meleklerdir.\nII. Doğa olayları ile görevlidir ve canlıların rızıklarını yönetmekle görevlidir.\nIII. Allah’ın emir ve yasaklarını peygamberlere iletmekle görevli olan melektir.\n\nNumaralanmış cümlelerde görevleri yazılan melekler aşağıdakilerin hangisinde doğru belirtilmiştir? (I – II – III)",o:["Kirâmen Kâtibin – Mikail – Cebrail","Kirâmen Kâtibin – İsrafil – Mikail","Münker-Nekir – Cebrail – Mikail","Münker-Nekir – Mikail – Cebrail"],a:3},
{q:"\"O, insanı pişmiş çamur gibi kuru bir balçıktan yarattı. Cinleri de dumansız ateşten (mâric) yarattı.\" (Rahmân Suresi, 14-15. Ayetler)\n\nBu ayetlerden hareketle aşağıdakilerden hangisi söylenemez?",o:["İnsanın yaratılış ham maddesi topraktır.","Cinler dumansız ateşten yaratılmıştır.","Varlıkların yaratılış özellikleri farklıdır.","Cinler meleklerden daha üstün varlıklardır."],a:3},
{q:"Öğretmen öğrencilerinden melekleri insanlardan ayıran özellikleri yazmalarını istemiştir.\n\nAşağıdaki öğrencilerden hangisinin verdiği bilgi yanlıştır?",o:["Elif: “Melekler Allah’ın emirlerine itaat eder.”","Mert: “Melekler gözle görülemeyen varlıklardır.”","Zeynep: “Melekler Allah tarafından yaratılmıştır.”","Eren: “Melekler insanlar gibi yer, içer ve uyur.”"],a:3},
{q:"Öğretmen tahtaya bir melek hakkında şu ipuçlarını yazmıştır:\n- Vahiy ile ilişkilidir.\n- Peygamberlere Allah’ın mesajlarını ulaştırmıştır.\n- Kur’an-ı Kerim’i Hz. Muhammed’e (s.a.v.) ulaştırmıştır.\n\nBu özellikler aşağıdaki meleklerden hangisine aittir?",o:["Mikâil (a.s.)","İsrafil (a.s.)","Cebrâil (a.s.)","Azrâil (a.s.)"],a:2}]};
const K="dkab_v2",L="ABCD",$=s=>document.getElementById(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let D=EMB||JSON.parse(localStorage.getItem(K)||"null")||DEF,i=0,ans=[],edit=-1;
if(EMB)$("menuBtn").style.display="none";
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
function basla(){i=0;ans=[];show()}
function show(){
 const n=D.qs.length,a=$("app");
 if(!n){a.innerHTML='<div class="card">Henüz soru yok. Menüden soru ekleyin.</div>';return}
 if(i>=n)return sonuc();
 const q=D.qs[i],d=ans[i]!==undefined;
 a.innerHTML=`<div class="card"><div class="top"><span>${esc(D.m.b)}</span><span>Soru ${i+1}/${n}</span></div><div class="bar"><i style="width:${i/n*100}%"></i></div>
 <div class="q">${esc(q.q)}</div>`+q.o.map((o,k)=>`<button class="opt ${d?(k==q.a?'ok':k==ans[i]?'no':''):''}" ${d?'disabled':''} onclick="sec(${k})"><b>${L[k]})</b> ${esc(o)}</button>`).join("")+
 `<div class="nav">${d?`<button class="btn" onclick="i++;show()">${i==n-1?'Sonucu Gör ✔':'Sonraki Soru ›'}</button>`:`<button class="btn d" onclick="ans[i]=-1;i++;show()">Boş geç</button>`}</div></div>`}
function sec(k){ans[i]=k;show()}
function sonuc(){
 let d=0,y=0,b=0;D.qs.forEach((q,k)=>{const v=ans[k];if(v===undefined||v<0)b++;else if(v==q.a)d++;else y++});
 const n=D.qs.length,p=Math.round(d/n*100);
 $("app").innerHTML=`<div class="card"><h2 style="margin-top:0">📊 Test Sonucu</h2>
 <div class="stats"><div class="st" style="background:var(--g)"><b>${d}</b>Doğru</div><div class="st" style="background:var(--r)"><b>${y}</b>Yanlış</div><div class="st" style="background:#f59e0b"><b>${b}</b>Boş</div><div class="st" style="background:var(--n)"><b>%${p}</b>Başarı</div></div>
 <div class="bar"><i style="width:${p}%;background:var(--g)"></i></div>
 <p>Net: <b>${(d-y/3).toFixed(2)}</b> (3 yanlış 1 doğruyu götürür)</p>
 <h3>Doğru / Yanlış Listesi</h3>`+D.qs.map((q,k)=>{const v=ans[k],c=v===undefined||v<0?'bos':v==q.a?'ok':'no';
 return `<div class="row ${c}"><b>${k+1}.</b> ${c=='ok'?'✅ Doğru':c=='no'?'❌ Yanlış':'⚠️ Boş'} — Senin cevabın: <b>${v>=0?L[v]:'-'}</b>${c!='ok'?` · Doğru cevap: <b>${L[q.a]}) ${esc(q.o[q.a])}</b>`:''}</div>`}).join("")+
 `<div class="bt"><button class="btn" onclick="basla()">🔄 Tekrar Çöz</button><button class="btn d" onclick="pr('sonuc')">🖨️ Sonucu Yazdır</button></div></div>`}
/* Menü */
function openM(){$("modal").style.display="block";$("mb").value=D.m.b;$("mk").value=D.m.k;$("ms").value=D.m.s;$("mu").value=D.m.u;liste()}
function closeM(){D.m={b:$("mb").value,k:$("mk").value,s:$("ms").value,u:$("mu").value};save();$("modal").style.display="none"}
function liste(){$("list").innerHTML=D.qs.map((q,k)=>`<div class="li"><b>${k+1}.</b><span>${esc(q.q.slice(0,70))}…</span><button class="btn d" onclick="duz(${k})">✏️</button><button class="btn r" onclick="sil(${k})">🗑️</button></div>`).join("")}
function ekle(){const o=[oa,ob,oc,od].map(e=>e.value.trim()),t=qt.value.trim();if(!t||o.some(x=>!x))return alert("Soru ve 4 şık gerekli");
 const s={q:t,o,a:L.indexOf(oz.value)};edit>=0?D.qs[edit]=s:D.qs.push(s);edit=-1;eb.textContent="➕ Soruyu Ekle";ft.textContent="Soru ekle";
 [qt,oa,ob,oc,od].forEach(e=>e.value="");save();liste()}
function duz(k){const q=D.qs[k];edit=k;qt.value=q.q;[oa,ob,oc,od].forEach((e,j)=>e.value=q.o[j]);oz.value=L[q.a];eb.textContent="💾 Güncelle";ft.textContent="Soru düzenle: "+(k+1)}
function sil(k){D.qs.splice(k,1);save();liste()}
function yeni(){if(confirm("Yeni boş yarışma açılsın mı?")){D={m:{b:"Yeni Test",k:"",s:"",u:""},qs:[]};save();openM()}}
function tumSil(){if(confirm("Tüm sorular silinsin mi?")){D.qs=[];save();liste()}}
function dl(n,t,ty){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:ty}));a.download=n;a.click()}
function yayimla(){closeM();const h="<!DOCTYPE html>"+document.documentElement.outerHTML;dl("yarisma.html",h.replace("const EMB"+"=null;","const EMB="+JSON.stringify(D)+";"),"text/html")}
/* Rapor: şablondaki gibi iki sütun */
function rapor(mod){
 const h=`<div class="rh"><div class="no">${esc(D.m.s)}</div><div style="font-size:11px">SINIF</div><h2>${esc(D.m.b)}${mod=='sonuc'?' – SONUÇ':''}</h2><div style="font-size:11px">ÜNİTE</div><div class="no">${esc(D.m.u)}</div></div><div class="rk">${esc(D.m.k)}</div>`;
 if(mod=='sonuc'){let d=0;const r=D.qs.map((q,k)=>{const v=ans[k],ok=v==q.a;d+=ok?1:0;return `<div class="rq"><b>${k+1}.</b> ${v===undefined||v<0?'⚠ Boş':ok?'✔ Doğru':'✘ Yanlış'} — Cevap: ${v>=0?L[v]:'-'} / Doğru: ${L[q.a]}</div>`}).join("");
  return h+`<p><b>Doğru: ${d} · Yanlış: ${ans.filter((v,k)=>v>=0&&v!=D.qs[k].a).length} · Boş: ${D.qs.length-ans.filter(v=>v>=0).length} · Başarı: %${Math.round(d/D.qs.length*100)}</b></p><div class="cols">${r}</div>`}
 return h+'<div class="cols">'+D.qs.map((q,k)=>`<div class="rq"><div class="q"><b>${k+1}.</b> ${esc(q.q)}</div><div class="ro">${q.o.map((o,j)=>`<span>${L[j]}) ${esc(o)}</span>`).join("")}</div></div>`).join("")+'</div><div class="ak"><b>Cevap Anahtarı:</b> '+D.qs.map((q,k)=>`${k+1}-${L[q.a]}`).join("  ")+'</div>'}
function pr(m){$("rapor").innerHTML=rapor(m);document.body.dataset.p=m;setTimeout(()=>{print();delete document.body.dataset.p},150)}
function word(){const n=D.qs.length,hf=Math.ceil(n/2);const c=k=>{const q=D.qs[k];return q?`<td style="width:50%;vertical-align:top;padding:6px;font-size:11pt"><b>${k+1}.</b> ${esc(q.q).replace(/\n/g,"<br>")}<br>${q.o.map((o,j)=>`${L[j]}) ${esc(o)}`).join("<br>")}</td>`:"<td></td>"};
 let t=`<h2 style="background:#1b3250;color:#fff;padding:6px;text-align:center">${esc(D.m.s)}. SINIF – ${esc(D.m.b)} – ${esc(D.m.u)}. ÜNİTE</h2><p><b>${esc(D.m.k)}</b></p><table style="width:100%">`;
 for(let k=0;k<hf;k++)t+=`<tr>${c(k)}${c(k+hf)}</tr>`;
 t+=`</table><p><b>Cevap Anahtarı:</b> ${D.qs.map((q,k)=>`${k+1}-${L[q.a]}`).join(" ")}</p>`;
 dl("test.doc",`<html><head><meta charset="utf-8"></head><body>${t}</body></html>`,"application/msword")}
/* Yükle: JSON veya PDF (pdf.js ile, en iyi çaba) */
yuk.onchange=async e=>{const f=e.target.files[0];if(!f)return;
 if(f.name.endsWith(".json")){try{D=JSON.parse(await f.text());save();openM()}catch(x){alert("Geçersiz JSON")}return}
 try{if(!window.pdfjsLib){await new Promise((r,j)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";s.onload=r;s.onerror=j;document.head.appendChild(s)});pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"}
  const p=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let tx="";
  for(let k=1;k<=p.numPages;k++){const c=await(await p.getPage(k)).getTextContent();tx+=c.items.map(x=>x.str).join(" ")+" "}
  const parts=tx.replace(/\s+/g," ").split(/\s(?=\d{1,2}\.\s+\D)/),max=+ns.value,out=[];
  for(const s of parts){const m=s.match(/^\d{1,2}\.\s+(.*?)\s*A\)\s*(.*?)\s*B\)\s*(.*?)\s*C\)\s*(.*?)\s*D\)\s*(.*)$/);if(m&&out.length<max)out.push({q:m[1],o:[m[2],m[3],m[4],m[5].slice(0,120)],a:0})}
  if(!out.length)return alert("Soru bulunamadı");D.qs=D.qs.concat(out);save();liste();alert(out.length+" soru eklendi. Doğru cevapları kontrol edin (varsayılan A).")
 }catch(x){alert("PDF okunamadı")}e.target.value=""};
basla();
</script></body></html>
